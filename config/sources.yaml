# All Tech Stocks: source list
#
# tier:      1 major financial and national, 2 markets and business specialist, 3 tech press,
#            4 primary (company newsrooms, exchange announcements), 0 backfill
# weight:    what one write-up from this outlet adds to a story's coverage score
# sections:  where this source's stories usually belong (a hint, keywords win)
# paywall:   true adds a £ tag when we have to link it
# confirm:   a primary source that needs one outlet to cover the story too
# always_tech: every item counts as tech, even if the headline doesn't say so
# ticker:    a company's own newsroom: every item is tagged with this stock
# domain:    used to match Google News items back to this outlet
# google:    a Google News feed. The real outlet is read from each item
#
# Google News queries for every stock on the watchlist are added automatically (see auto_google in
# rules.yaml), so you don't need to list companies here.
#
# Every URL below needs checking once the engine runs for real.
# Open /status.html on the site to see which feeds work.

sources:
  # ---------- Tier 1: major financial and national ----------
  - id: reuters
    name: Reuters
    url: https://news.google.com/rss/search?q=site:reuters.com+(technology+OR+chip+OR+software+OR+shares)+when:1d&hl=en-US&gl=US&ceid=US:en
    domain: reuters.com
    google: true
    tier: 1
    weight: 3
    sections: [results, deals]

  - id: bloomberg
