# All Tech Stocks: the watchlist
#
# Every story is tagged with the stocks it mentions, using the names below.
# Add, remove or edit freely. Changes apply on the next hourly run.
#
# symbol:      the ticker as the exchange lists it. Put quotes round tickers YAML reads as words: "ON", "YES", "NO"
# exchange:    NASDAQ, NYSE or LSE
# country:     optional, UK or US, only when the company is based somewhere other than where it trades (Arm)
# name:        shown on the site
# aliases:     words that tag a story with this stock, matched on whole words, any case
# exact:       words matched with exact capitals only, for names that are also everyday words
#              ("Arm" the company, not "arm" the body part)
# group:       software, chips, internet, hardware, security, fintech, games, telecoms, services, data
# ignore:      optional phrases that look like the name but aren't the company ("per capita")
# business_only: optional, true for names that are also consumer content (Netflix). A headline naming
#              only this stock needs one of exclude.business_words in rules.yaml, or it never runs.
# query:       optional Google News search phrases, for names that are everyday words ("Zoom", "Block")
# results:     optional next results date (YYYY-MM-DD), shown on the stock's page. Fill in from the
#              company's investor relations site. Leave it out if you don't know.
#
# Google News queries for each stock are built from these names automatically.
# Check the status page after the first week: stocks with no coverage at all may need better aliases,
# or may have been taken private or delisted.

stocks:
  # Which country: where the company is headquartered. It must also be listed in New York or London.
  # A company based in the UK but listed only in New York (Arm) goes on the UK side with country: UK.
  # Not on the list because they're based elsewhere: SAP (Germany), ASML and NXP (Netherlands),
  # TSMC (Taiwan), Spotify (Sweden), Shopify (Canada), Accenture and Seagate (Dublin).
  # What counts as a tech stock: US companies in the GICS Information Technology or Communication Services
  # sectors (check the S&P 500 list or the company's own filings); UK companies the London Stock Exchange
  # files under Technology or Telecommunications (see the UK section). Not on the list for that reason:
  # Amazon, Tesla, Airbnb, DoorDash (Consumer Discretionary), Uber (Industrials), PayPal, Block, Coinbase,
  # Robinhood and Wise (Financials; Wise moved its main listing to Nasdaq in May 2026). Electronic Arts was taken private.
